services:
  - type: web
    name: studyverse-pro
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: ./data/studyverse.sqlite
      - key: JWT_SECRET
        generateValue: true
